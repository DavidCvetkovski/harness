name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite is pure standard library, so it runs anywhere Python does —
    # including Linux, even though Harness itself only runs on macOS.
    #
    # Pinned rather than ubuntu-latest: from 26.04 on there is no Python 3.9
    # build to install, and 3.9 is the one that matters most — it is what
    # macOS ships as /usr/bin/python3.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Check every module imports and compiles
        run: python -m compileall -q harness tests voice

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet ruff
      - name: Lint
        run: ruff check harness tests voice
