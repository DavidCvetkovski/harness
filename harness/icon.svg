<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    A small machine that is paying attention.

    Full bleed on purpose. iOS masks a home-screen icon to its own squircle, so
    an icon that rounds its own corners leaves the sliver between the two curves
    transparent — which iOS composites onto white, and the app shows up as a
    white tile with a smudge in the corner. Let the platform do the rounding.

    Everything therefore stays inside the middle 80%, which is the part no mask
    ever clips. Built to survive 16px too: the two amber eyes are the only thing
    that has to read at favicon size, and they are deliberately different sizes —
    perfect symmetry reads as a logo, slight asymmetry reads as a face with an
    opinion.
  -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2220"/>
      <stop offset="1" stop-color="#0b0d0c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffc76b"/>
      <stop offset="1" stop-color="#e8a33d"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" fill="url(#shell)"/>

  <!-- scanlines, echoing the app's instrument-panel texture -->
  <g fill="#ffffff" opacity="0.04">
    <rect x="0" y="14" width="64" height="1"/>
    <rect x="0" y="21" width="64" height="1"/>
    <rect x="0" y="28" width="64" height="1"/>
    <rect x="0" y="35" width="64" height="1"/>
    <rect x="0" y="42" width="64" height="1"/>
    <rect x="0" y="49" width="64" height="1"/>
  </g>

  <!-- antenna -->
  <line x1="32" y1="11" x2="32" y2="19" stroke="#3a4741" stroke-width="2.5"
        stroke-linecap="round"/>
  <circle cx="32" cy="9" r="3.2" fill="#8fbf7f"/>

  <!-- eyes -->
  <circle cx="22" cy="35" r="8" fill="url(#glow)"/>
  <circle cx="44" cy="35" r="5.6" fill="url(#glow)"/>
  <circle cx="19.6" cy="32.6" r="2.5" fill="#0b0d0c" opacity="0.55"/>
  <circle cx="42.3" cy="33.3" r="1.8" fill="#0b0d0c" opacity="0.55"/>

  <!-- mouth: a readout, not a smile -->
  <rect x="22" y="50" width="20" height="3.4" rx="1.7" fill="#8fbf7f" opacity="0.85"/>
  <rect x="45" y="50" width="4.4" height="3.4" rx="1.7" fill="#3a4741"/>
</svg>
