name: Harness
options:
  bundleIdPrefix: com.davidcvetkovski
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "$(TARGET_NAME)"
    GENERATE_INFOPLIST_FILE: false
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Harness:
    type: application
    platform: iOS
    sources:
      - path: Harness
        excludes:
          - "**/*.md"
    info:
      path: Harness/Info.plist
      properties:
        CFBundleDisplayName: Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Harness uses the camera to scan the setup QR code shown on your Mac and to take photos you attach to vision messages.
        NSPhotoLibraryUsageDescription: Harness accesses your photo library so you can attach images to send to your Mac's local vision model.
        NSLocalNetworkUsageDescription: Harness connects to the Harness server running on your Mac over your local Wi-Fi network or Tailscale.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        INFOPLIST_FILE: Harness/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.davidcvetkovski.harness
        CODE_SIGN_STYLE: Automatic
  HarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessTests
    dependencies:
      - target: Harness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.davidcvetkovski.harness.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Harness.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Harness"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Harness:
    build:
      targets:
        Harness: all
        HarnessTests: [test]
    test:
      targets:
        - HarnessTests
